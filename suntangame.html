
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>מסע הבוסים - Boss Rush</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --grass:#5d9c3f;
    --grass-dark:#4a7d32;
    --dirt:#8b5a2b;
    --dirt-dark:#6b4420;
    --stone:#8a8a8a;
    --stone-light:#c9c9c9;
    --stone-dark:#5a5a5a;
    --sky:#6fb8e0;
    --gold:#ffd23f;
    --danger:#e6483f;
    --heart:#e6483f;
    --panel-bg:#2a2a2a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    background:#151515;
    font-family:'Press Start 2P', monospace;
    color:#fff;
    -webkit-font-smoothing:none;
    image-rendering:pixelated;
  }
  #game-wrap{
    position:relative;width:100vw;height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:#151515;
  }
  canvas{
    background:var(--sky);
    image-rendering:pixelated;
    display:block;
    max-width:100vw;max-height:100vh;
  }

  /* Minecraft-style beveled button */
  .mc-btn{
    font-family:'Press Start 2P', monospace;
    font-size:14px;
    color:#fff;
    background:#7d7d7d;
    border:none;
    padding:14px 22px;
    cursor:pointer;
    text-shadow:2px 2px 0 #2b2b2b;
    box-shadow:
      inset -4px -4px 0 0 #3f3f3f,
      inset 4px 4px 0 0 #b5b5b5;
    transition:transform .05s ease;
    letter-spacing:1px;
  }
  .mc-btn:hover{ background:#8f8f8f; }
  .mc-btn:active{
    transform:translateY(2px);
    box-shadow:
      inset -3px -3px 0 0 #3f3f3f,
      inset 3px 3px 0 0 #b5b5b5;
  }
  .mc-btn.gold{
    background:#c9962f;
    box-shadow:
      inset -4px -4px 0 0 #7a5a17,
      inset 4px 4px 0 0 #f3d27a;
  }
  .mc-btn.gold:hover{ background:#dba838; }

  .mc-panel{
    background:var(--panel-bg);
    border:4px solid #000;
    box-shadow:
      inset -4px -4px 0 0 #111,
      inset 4px 4px 0 0 #4a4a4a;
    padding:28px 34px;
    margin:auto 0;
  }

  #overlay{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:flex-start;
    text-align:center;
    background:rgba(0,0,0,0.55);
    flex-direction:column;
    gap:18px;
    background-size:cover;
    background-position:center;
    overflow-y:auto;
    padding:24px 0;
  }
  #overlay.hidden{display:none;}
  #overlay.start-bg{
    background-image:linear-gradient(rgba(10,10,10,0.55),rgba(10,10,10,0.72)), url('sun-tan-logo.webp');
  }
  #overlay h1{
    font-size:22px;
    color:var(--gold);
    text-shadow:3px 3px 0 #000;
    margin:0 0 6px 0;
    line-height:1.6;
  }
  #overlay p{
    font-size:11px;
    line-height:1.9;
    color:#e5e5e5;
    margin:4px 0;
  }
  #overlay .sub{ color:var(--gold); }

  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 18px;
    pointer-events:none;
    font-size:10px;
  }
  #hearts{ display:flex; gap:4px; }
  .heart{
    width:22px;height:20px;
    background:var(--heart);
    position:relative;
    clip-path:polygon(50% 100%, 8% 55%, 0% 30%, 15% 5%, 35% 5%, 50% 22%, 65% 5%, 85% 5%, 100% 30%, 92% 55%);
    box-shadow: inset -3px -3px 0 rgba(0,0,0,.35);
  }
  .heart.empty{ background:#3a3a3a; }
  .heart.half{ background: linear-gradient(90deg, var(--heart) 50%, #3a3a3a 50%); }

  #trophy-box{
    background:rgba(0,0,0,.5);
    border:2px solid #000;
    padding:6px 12px;
    display:flex;align-items:center;gap:8px;
    box-shadow: inset -2px -2px 0 0 #111, inset 2px 2px 0 0 #4a4a4a;
  }
  #trophy-icon{
    width:14px;height:14px;background:var(--gold);
    box-shadow: inset -2px -2px 0 rgba(0,0,0,.4);
  }

  #boss-hud{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:min(60%,520px);
    text-align:center;
    pointer-events:none;
  }
  #boss-name{
    font-size:11px; color:#fff; text-shadow:2px 2px 0 #000; margin-bottom:6px;
  }
  #boss-bar-bg{
    width:100%; height:16px; background:#2a2a2a; border:2px solid #000;
  }
  #boss-bar-fill{
    height:100%; background:var(--danger);
    box-shadow: inset -2px -2px 0 rgba(0,0,0,.3);
    width:100%;
    transition:width .15s ease;
  }

  #level-tag{
    position:absolute; bottom:14px; right:18px;
    font-size:10px; color:#ddd; text-shadow:2px 2px 0 #000;
    pointer-events:none;
  }

  #controls-hint{
    position:absolute; bottom:14px; left:18px;
    font-size:8px; color:#cfcfcf; text-shadow:2px 2px 0 #000;
    pointer-events:none; line-height:1.8;
  }

  .boss-track{
    display:flex; gap:6px; justify-content:center; flex-wrap:wrap; max-width:420px; margin:10px 0;
  }
  .boss-dot{
    width:16px;height:16px;
    background:#3a3a3a;
    border:2px solid #000;
    box-shadow: inset -2px -2px 0 rgba(0,0,0,.4);
  }
  .boss-dot.done{ background:var(--gold); }
  .boss-dot.current{ background:var(--danger); }

  #char-name-input{
    font-family:'Press Start 2P', monospace;
    font-size:10px;
    background:#1c1c1c;
    border:2px solid #000;
    color:#fff;
    padding:8px 10px;
    text-align:center;
    width:220px;
    box-shadow: inset -2px -2px 0 0 #111, inset 2px 2px 0 0 #4a4a4a;
  }

  #home-trophy-badge{ display:none; }
  #overlay.home-mode #home-trophy-badge{
    display:flex; align-items:center; gap:8px;
    position:absolute; top:18px; left:18px;
    background:rgba(0,0,0,.55); border:2px solid #000;
    padding:8px 12px; font-size:12px;
    box-shadow: inset -2px -2px 0 0 #111, inset 2px 2px 0 0 #4a4a4a;
  }
  #home-trophy-icon{
    width:14px;height:14px;background:var(--gold);
    box-shadow: inset -2px -2px 0 rgba(0,0,0,.4);
  }
  #home-money-badge{ display:none; }
  #overlay.home-mode #home-money-badge{
    display:flex; align-items:center; gap:8px;
    position:absolute; top:64px; left:18px;
    background:rgba(0,0,0,.55); border:2px solid #000;
    padding:8px 12px; font-size:12px;
    box-shadow: inset -2px -2px 0 0 #111, inset 2px 2px 0 0 #4a4a4a;
  }
  #home-money-icon{
    width:14px;height:14px;background:#4fd67a;
    box-shadow: inset -2px -2px 0 rgba(0,0,0,.4);
  }
  #voucher-open-btn{ display:none; }
  #overlay.home-mode #voucher-open-btn{
    display:inline-block;
    position:absolute; top:18px; right:18px;
    font-size:11px; padding:10px 16px;
  }

  .char-row{
    display:flex; gap:16px; justify-content:center; margin:10px 0;
    flex-wrap:wrap; max-width:420px;
  }
  .char-card{
    width:100px;
    background:#1c1c1c;
    border:3px solid #000;
    padding:8px 6px 10px;
    cursor:pointer;
    box-shadow: inset -3px -3px 0 0 #0a0a0a, inset 3px 3px 0 0 #3a3a3a;
  }
  .char-card canvas{ display:block; margin:0 auto 6px; image-rendering:pixelated; }
  .char-card .cname{ font-size:8px; line-height:1.5; }
  .char-card.rare{
    border-color:#3fae3f;
    box-shadow: inset -3px -3px 0 0 #1e5c1e, inset 3px 3px 0 0 #7be07b;
  }
  .char-card.epic{
    border-color:#9b30ff;
    box-shadow: inset -3px -3px 0 0 #4a1080, inset 3px 3px 0 0 #c98cff;
  }
  .char-card.legendary{
    border-color:#ffb400;
    box-shadow: inset -3px -3px 0 0 #7a5200, inset 3px 3px 0 0 #ffd97a;
  }
  .char-card.amazing{
    border-color:#e63946;
    box-shadow: inset -3px -3px 0 0 #7a1018, inset 3px 3px 0 0 #ff8f96;
  }
  .char-card.selected{
    border-color:#ff8c1a;
    box-shadow: inset -3px -3px 0 0 #7a3f00, inset 3px 3px 0 0 #ffb870;
  }
  .char-card.locked{
    cursor:not-allowed;
    opacity:0.55;
    filter:grayscale(1);
  }
  .char-card .lock-label{
    font-size:7px; color:var(--gold); margin-top:4px; filter:none; opacity:1;
  }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="960" height="600"></canvas>

  <div id="hud">
    <div id="hearts"></div>
    <div id="trophy-box"><div id="trophy-icon"></div><span id="trophy-count">0</span></div>
  </div>

  <div id="boss-hud">
    <div id="boss-name">-</div>
    <div id="boss-bar-bg"><div id="boss-bar-fill"></div></div>

  <div id="level-tag">בוס 1 / 10</div>
  <div id="controls-hint">חצים / WASD = תנועה<br>רווח = תקיפה<br>Esc = מנוחה</div>

  <div id="overlay" class="start-bg">
    <div id="home-trophy-badge"><div id="home-trophy-icon"></div><span id="home-trophy-count">0</span></div>
    <div id="home-money-badge"><div id="home-money-icon"></div><span id="home-money-count">0</span></div>
    <button class="mc-btn gold" id="voucher-open-btn">שובר</button>
    <div class="mc-panel" id="panel-content">
      <h1>סאן תאן</h1>
    </div>
  </div>
</div>

  let bonusHearts = 0; // from loot box "extra life" rewards, resets each new run
  let money = 0; // separate currency from trophies - earned from boxes, spent on skins
  const characterTrophies = {}; // per-character trophy total, used for character rank

  function awardTrophies(amount){
    trophies += amount;
    trophyCountEl.textContent = trophies;
    updateHomeTrophyDisplay();
    if(!characterTrophies[selectedCharKey]) characterTrophies[selectedCharKey] = 0;
    characterTrophies[selectedCharKey] += amount;
  }

  function getCharacterRank(key){
    const t = characterTrophies[key] || 0;
    return Math.floor(t / 50) + 1; // every 50 trophies with this character = +1 rank
  }

  let player, boss, projectiles, particles;

  function initPlayer(){
    const charDef = CHARACTERS[selectedCharKey];
    const maxHp = (charDef.maxHearts + bonusHearts) * 2;
    player = {
      x: W/2, y: H - 110,
      w: 30, h: 38,
      facing: 'up',
      maxHp: maxHp,
      hp: maxHp,
      attackTimer: 0,
      attackCooldownTimer: 0,
      invulnTimer: 0,
      moving:false,
      skin: charDef, // gameplay stats (attackDamage etc.)
      displaySkin: getActiveSkin(selectedCharKey) // colors only - may be a cosmetic skin
    };
  }

  // Per-boss stats. hitDamage = fallback melee/projectile damage (points; 2 points = 1 heart).
  // rangedDamage/closeDamage override hitDamage separately for projectile-hit vs touch-hit.
  // pulseMode bosses ignore touch/projectile entirely and instead tick pulseDamage every
  // pulseInterval ms if the player is within pulseRadius (a huge radius = always, regardless of distance).
  const BOSS_STATS = [
    /* 0 zombie        */ { maxHp:10, hitDamage:1, chargeMultiplier:2 }, // 5 hearts
    /* 1 skeleton      */ { maxHp:14, hitDamage:2, chargeMultiplier:1 }, // 7 hearts, every hit = 1 heart flat
    /* 2 spider        */ { maxHp:20, hitDamage:4, chargeMultiplier:1 }, // 10 hearts, every hit = 2 hearts flat
    /* 3 creeper       */ { maxHp:30, pulseMode:true, pulseInterval:2000, pulseRadius:95, pulseDamage:6 }, // 15 hearts
    /* 4 enderman      */ { maxHp:28, rangedDamage:6, closeDamage:2, chargeMultiplier:1 }, // 14 hearts: far=3 hearts, close=1 heart
    /* 5 golem         */ { maxHp:28, pulseMode:true, pulseInterval:1000, pulseRadius:100, pulseDamage:8 }, // 14 hearts, close=4 hearts/1s
    /* 6 wither sk     */ { maxHp:40, rangedDamage:6, closeDamage:0, chargeMultiplier:1, shootInterval:2000, chargeInterval:999999 }, // 20 hearts, fires a bolt every 2s for 3 hearts
    /* 7 blaze         */ { maxHp:34, rangedDamage:8, closeDamage:2, chargeMultiplier:1 }, // 17 hearts: far=4 hearts, close=1 heart
    /* 8 guardian      */ { maxHp:16, pulseMode:true, pulseInterval:500, pulseRadius:90, pulseDamage:1 }, // 8 hearts, half heart/0.5s while close
    /* 9 dragon        */ { maxHp:50, rangedDamage:6, closeDamage:0, chargeMultiplier:1, shootInterval:1000, chargeInterval:999999 }, // 25 hearts, fires a visible breath bolt every 1s for 3 hearts
    /* 10 piglin brute */ { maxHp:44, hitDamage:2, chargeMultiplier:2 }, // 22 hearts
    /* 11 hoglin       */ { maxHp:48, hitDamage:3, chargeMultiplier:2 }, // 24 hearts, charges hard
    /* 12 phantom      */ { maxHp:40, pulseMode:true, pulseInterval:1500, pulseRadius:100, pulseDamage:3 }, // 20 hearts, swoops
    /* 13 shulker      */ { maxHp:46, rangedDamage:4, closeDamage:1, chargeMultiplier:1 }, // 23 hearts, mostly ranged
    /* 14 ravager      */ { maxHp:56, hitDamage:4, chargeMultiplier:2 }, // 28 hearts, heavy melee
    /* 15 pillager     */ { maxHp:44, rangedDamage:3, closeDamage:1, chargeMultiplier:1 }, // 22 hearts, crossbow
    /* 16 warden       */ { maxHp:68, rangedDamage:6, closeDamage:0, chargeMultiplier:1, shootInterval:1200, chargeInterval:999999 }, // 34 hearts, sonic-boom bolt every 1.2s
    /* 17 evoker       */ { maxHp:52, pulseMode:true, pulseInterval:1300, pulseRadius:110, pulseDamage:4 }, // 26 hearts
    /* 18 vindicator   */ { maxHp:60, hitDamage:5, chargeMultiplier:2 }, // 30 hearts, axe swings hard
    /* 19 wither       */ { maxHp:80, rangedDamage:8, closeDamage:0, chargeMultiplier:1, shootInterval:1000, chargeInterval:999999 } // 40 hearts, final boss - fires a skull bolt every 1s for 4 hearts
  ];

  function bossStatsForLevel(i){
    const custom = BOSS_STATS[i] || {};
    return {
      maxHp: custom.maxHp != null ? custom.maxHp : (18 + i*7),
      speed: 0.9 + i*0.12,
      shootInterval: custom.shootInterval != null ? custom.shootInterval : Math.max(2600 - i*180, 1100),
      chargeInterval: custom.chargeInterval != null ? custom.chargeInterval : Math.max(3400 - i*160, 1600),
      projSpeed: 3 + i*0.25,
      hitDamage: custom.hitDamage != null ? custom.hitDamage : 1,
      rangedDamage: custom.rangedDamage, // undefined => falls back to hitDamage
      closeDamage: custom.closeDamage,   // undefined => falls back to hitDamage
      chargeMultiplier: custom.chargeMultiplier != null ? custom.chargeMultiplier : 2,
      pulseMode: !!custom.pulseMode,
      pulseInterval: custom.pulseInterval || 2000,
      pulseRadius: custom.pulseRadius != null ? custom.pulseRadius : 95,
      pulseDamage: custom.pulseDamage != null ? custom.pulseDamage : 6
    };
  }

  function initBoss(i){
    const theme = BOSS_THEMES[i];
    const stats = bossStatsForLevel(i);
    boss = {
      x: W/2, y: 130,
      w: 70, h: 78,
      theme, ...stats,
      hp: stats.maxHp,
      shootTimer: 1200,
      chargeTimer: 2000,
      pulseTimer: stats.pulseInterval || 2000,
      charging:false,
      chargeWindup:0,
      chargeDir:{x:0,y:0},
      hitFlash:0
    };
    projectiles = [];
    particles = [];
    bossNameEl.textContent = theme.name;
    levelTag.textContent = 'בוס ' + (i+1) + ' / ' + TOTAL_BOSSES;
    updateBossBar();
  }

  function updateBossBar(){
    const pct = Math.max(0, boss.hp / boss.maxHp) * 100;
    bossBarFill.style.width = pct + '%';
  }

  const HEART_ICON_LIMIT = 10; // above this, show a number instead of icons

  function updateHearts(){
    heartsEl.innerHTML = '';
    const totalHearts = Math.ceil(player.maxHp/2);
    const fullHearts = Math.floor(player.hp/2);
    const half = player.hp % 2 === 1;

    if(totalHearts > HEART_ICON_LIMIT){
      const bigHeart = document.createElement('div');
      bigHeart.className = 'heart';
      heartsEl.appendChild(bigHeart);
      const label = document.createElement('div');
      label.style.cssText = 'font-size:12px; color:#fff; text-shadow:2px 2px 0 #000; align-self:center;';
      const curVal = half ? (fullHearts + 0.5) : fullHearts;
      label.textContent = curVal + ' / ' + totalHearts;
      heartsEl.appendChild(label);
      return;
    }

    for(let i=0;i<totalHearts;i++){
      const d = document.createElement('div');
      if(i < fullHearts) d.className = 'heart';
      else if(i === fullHearts && half) d.className = 'heart half';
      else d.className = 'heart empty';
      heartsEl.appendChild(d);
    }
  }

  // ---------- Input ----------
  window.addEventListener('keydown', e=>{
    keys[e.key.toLowerCase()] = true;
    if(e.key === ' ') { doAttack(); e.preventDefault(); }
    if(e.key === 'Escape'){
      if(state === 'PLAYING'){ openPauseMenu(); }
      else if(state === 'PAUSED'){ resumeGame(); }
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

  function doAttack(){
    if(state !== 'PLAYING') return;
    if(player.attackCooldownTimer > 0) return;
    player.attackTimer = ATTACK_DURATION;
    player.attackCooldownTimer = ATTACK_COOLDOWN;
  }

  // ---------- Pause menu ----------
  function openPauseMenu(){
    state = 'PAUSED';
    showOverlay(
      '<h1>מושהה</h1>' +
      '<p class="sub">' + (boss ? boss.theme.name : '') + '</p>' +
      '<p style="font-size:8px;">Esc = המשך משחק</p>',
      [
        makeBtn('המשך משחק', 'gold', resumeGame),
        makeBtn('מסך בית', '', goHome),
        makeBtn('צא מהמשחק', '', exitGame)
      ]
    );
  }

  function resumeGame(){
    overlay.classList.add('hidden');
    state = 'PLAYING';
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function goHome(){
    state = 'START';
    showStartScreen();
  }

  function exitGame(){
    state = 'START';
    const closed = window.close();
    setTimeout(()=>{
      showOverlay(
        '<h1>תודה ששיחקת!</h1>' +
        '<p>אפשר לסגור את הלשונית עכשיו.</p>' +
        '<p class="sub">גביעים שנצברו: ' + trophies + '</p>',
        []
      );
    }, 100);

  // ---------- Character select / start screen ----------
  function drawCharThumb(tctx, ch){
    tctx.clearRect(0,0,60,70);
    const cx=30, cy=38;
    tctx.fillStyle = ch.pants;
    tctx.fillRect(cx-12, cy+10, 24, 16);
    tctx.fillStyle = ch.shoes;
    tctx.fillRect(cx-12, cy+24, 24, 5);
    tctx.fillStyle = ch.shirt;
    tctx.fillRect(cx-14, cy-10, 28, 22);
    tctx.fillStyle = ch.shirtDetail;
    tctx.fillRect(cx-3, cy-8, 6, 16);
    tctx.fillStyle = ch.shirt;
    tctx.fillRect(cx-19, cy-8, 6, 14);
    tctx.fillRect(cx+13, cy-8, 6, 14);
    tctx.fillStyle = ch.cuffs;
    tctx.fillRect(cx-19, cy+4, 6, 6);
    tctx.fillRect(cx+13, cy+4, 6, 6);
    tctx.fillStyle = ch.skin;
    tctx.fillRect(cx-11, cy-28, 22, 20);
    tctx.fillStyle = ch.hair;
    tctx.fillRect(cx-12, cy-30, 24, 9);
    tctx.fillStyle = ch.eyes;
    tctx.fillRect(cx-6, cy-18, 4, 4);
    tctx.fillRect(cx+3, cy-18, 4, 4);
  }

  function isCharUnlocked(ch){
    return trophies >= ch.unlock || !!unlockedByBossDefeat[ch.key] || !!unlockedByLootbox[ch.key];
  }

  function getCharacterProgressText(){
    const total = Object.keys(CHARACTERS).length;
    const unlocked = Object.values(CHARACTERS).filter(isCharUnlocked).length;
    return unlocked + '/' + total;
  }

  const RARITY_LABELS = {
    rare: {text:'✦ נדיר', color:'#7be07b'},
    epic: {text:'✦ אדיר', color:'#c98cff'},
    legendary: {text:'✦ אגדי', color:'#ffd97a'},
    amazing: {text:'✦ מדהים', color:'#ff8f96'}
  };

  const RARITY_ORDER = ['rare', 'epic', 'amazing', 'legendary'];

  function renderCharacterCards(){
    const container = document.getElementById('char-container');
    if(!container) return;
    container.innerHTML = '';

    // one continuous list ordered rare -> epic -> amazing -> legendary,
    // packed 3-per-row (a tier that doesn't fill its row shares the row with the next tier)
    const ordered = RARITY_ORDER.flatMap(rarity => Object.values(CHARACTERS).filter(ch => ch.rarity === rarity));

    let row = null;
    ordered.forEach((ch, idx)=>{
      if(idx % 3 === 0){
        row = document.createElement('div');
        row.className = 'char-row';
        container.appendChild(row);
      }

      const locked = !isCharUnlocked(ch);
      const card = document.createElement('div');
      card.className = 'char-card' + (ch.rarity && ch.rarity!=='common' ? ' '+ch.rarity : '') + (ch.key===selectedCharKey?' selected':'') + (locked?' locked':'');
      const cvs = document.createElement('canvas');
      cvs.width = 60; cvs.height = 70;
      card.appendChild(cvs);
      const label = document.createElement('div');
      label.className = 'cname';
      label.textContent = ch.name;
      card.appendChild(label);
      const rl = RARITY_LABELS[ch.rarity];
      if(rl){
        const rtag = document.createElement('div');
        rtag.style.cssText = 'font-size:6px;color:'+rl.color+';margin-top:2px;';
        rtag.textContent = rl.text;
        card.appendChild(rtag);
      }
      if(locked){
        const lock = document.createElement('div');
        lock.className = 'lock-label';
        let lockText;
        if(ch.rarity === 'epic') lockText = '🔒 מתיבת שלל';
        else if(ch.rarity === 'legendary') lockText = '🔒 בוס ראשי';
        else if(ch.rarity === 'amazing') lockText = '🔒 מתיבה מדהימה';
        else lockText = '🔒 ' + ch.unlock + ' גביעים';
        lock.textContent = lockText;
        card.appendChild(lock);
      } else {
        const rankTag = document.createElement('div');
        rankTag.style.cssText = 'font-size:6px;color:var(--gold);margin-top:2px;';
        rankTag.textContent = 'דרגה ' + getCharacterRank(ch.key) + ' · 🏆' + (characterTrophies[ch.key] || 0);
        card.appendChild(rankTag);
      }
      card.addEventListener('click', ()=>{
        if(locked) return;
        selectedCharKey = ch.key;
        renderCharacterCards();
      });
      row.appendChild(card);
      drawCharThumb(cvs.getContext('2d'), getActiveSkin(ch.key));
    });
  }

  function updateHomeTrophyDisplay(){
    const el = document.getElementById('home-trophy-count');
    if(el) el.textContent = trophies;
    const moneyEl = document.getElementById('home-money-count');

      '<button class="mc-btn" id="chars-btn" style="margin-top:10px;">דמויות</button>' +
      '<button class="mc-btn" id="skins-btn" style="margin-top:10px;">סקינים</button>' +

  function showCharacterScreen(){

    overlay.classList.add('home-mode');
    panelContent.innerHTML =

  function renderSkinCards(){
    const row = document.getElementById('skins-row');
    if(!row) return;
    row.innerHTML = '';
    Object.values(SKINS).forEach(sk=>{
      const owned = !!ownedSkins[sk.key];
      const equipped = equippedSkin[sk.forChar] === sk.key;
      const card = document.createElement('div');
      card.className = 'char-card' + (equipped ? ' selected' : '');
      const cvs = document.createElement('canvas');
      cvs.width = 60; cvs.height = 70;
      card.appendChild(cvs);
      const label = document.createElement('div');
      label.className = 'cname';
      label.textContent = sk.name;
      card.appendChild(label);
      const forLabel = document.createElement('div');
      forLabel.style.cssText = 'font-size:6px;color:#aaa;margin-top:2px;';
      forLabel.textContent = 'ל' + CHARACTERS[sk.forChar].name;
      card.appendChild(forLabel);

      const actionBtn = document.createElement('button');
      actionBtn.className = 'mc-btn';
      actionBtn.style.cssText = 'font-size:7px; padding:6px 8px; margin-top:6px;';
      if(equipped){
        actionBtn.textContent = 'לובש ✓';
        actionBtn.disabled = true;
        actionBtn.style.opacity = '0.6';
      } else if(owned){
        actionBtn.textContent = 'לבש';
        actionBtn.addEventListener('click', ()=>{
          equippedSkin[sk.forChar] = sk.key;
          if(player && selectedCharKey === sk.forChar) player.displaySkin = getActiveSkin(selectedCharKey);
          renderSkinCards();
        });
      } else {
        actionBtn.textContent = '💰 ' + sk.cost;
        if(money < sk.cost){
          actionBtn.disabled = true;
          actionBtn.style.opacity = '0.5';
        }
        actionBtn.addEventListener('click', ()=>{
          if(money < sk.cost) return;
          money -= sk.cost;
          ownedSkins[sk.key] = true;
          equippedSkin[sk.forChar] = sk.key;
          updateHomeTrophyDisplay();
          const moneyLine = document.getElementById('skins-money-count');
          if(moneyLine) moneyLine.textContent = '💰 ' + money;
          renderSkinCards();
        });
      }
      card.appendChild(actionBtn);
      row.appendChild(card);
      drawCharThumb(cvs.getContext('2d'), sk);
    });
  }

  function showSkinsScreen(){
    overlay.classList.add('start-bg');
    overlay.classList.add('home-mode');
    panelContent.innerHTML =
      '<h1>סקינים</h1>' +
      '<p style="font-size:9px;">כסף: <span class="sub" id="skins-money-count">💰 ' + money + '</span></p>' +
      '<div class="char-row" id="skins-row"></div>' +

  function showOverlay(html, buttons){

  function makeBtn(label, cls, onClick){
    const b = document.createElement('button');
    b.className = 'mc-btn ' + (cls||'');
    b.textContent = label;
    b.style.marginTop = '10px';
    b.addEventListener('click', onClick);
    return b;
  }

  function awardMoney(amt){
    money += amt;
    updateHomeTrophyDisplay();
  }

  function rollLootBox(){
    // Only epic-rarity characters come from the loot box (rare = trophies, legendary = main bosses)
    const eligibleChars = Object.values(CHARACTERS).filter(ch =>
      ch.rarity === 'epic' && !isCharUnlocked(ch)
    );
    // money is a flat 40% chance; the rest is split among the other outcomes
    const weights = eligibleChars.length > 0
      ? [ {type:'money', w:40}, {type:'nothing', w:30}, {type:'life', w:20}, {type:'character', w:10} ]
      : [ {type:'money', w:40}, {type:'nothing', w:40}, {type:'life', w:20} ];

    const total = weights.reduce((s,w)=>s+w.w, 0);
    let roll = Math.random()*total;
    let pick = weights[weights.length-1].type;
    for(const w of weights){
      if(roll < w.w){ pick = w.type; break; }
      roll -= w.w;
    }

    if(pick === 'life'){
      bonusHearts += 1;
      return '❤️ קיבלת לב תוסף לכל שאר המשחק!';
    }
    if(pick === 'money'){
      const amt = 20 + Math.floor(Math.random()*31); // 20-50
      awardMoney(amt);
      return '💰 קיבלת ' + amt + ' כסף!';
    }
    if(pick === 'character'){
      const ch = eligibleChars[Math.floor(Math.random()*eligibleChars.length)];
      unlockedByLootbox[ch.key] = true;
      return '🔓 פתחת דמות חדשה: ' + ch.name + '!';
    }
    return '💨 התיבה הייתה ריקה הפעם...';
  }

  function rollAmazingBox(){
    // money is a flat 40% chance; the rest is split among the other outcomes
    const eligibleChars = Object.values(CHARACTERS).filter(ch =>
      ch.rarity === 'amazing' && !isCharUnlocked(ch)
    );
    const weights = eligibleChars.length > 0
      ? [ {type:'money', w:40}, {type:'nothing', w:30}, {type:'life', w:20}, {type:'character', w:10} ]
      : [ {type:'money', w:40}, {type:'nothing', w:40}, {type:'life', w:20} ];

    const total = weights.reduce((s,w)=>s+w.w, 0);
    let roll = Math.random()*total;
    let pick = weights[weights.length-1].type;
    for(const w of weights){
      if(roll < w.w){ pick = w.type; break; }
      roll -= w.w;
    }

    if(pick === 'life'){
      bonusHearts += 1;
      return '❤️ קיבלת לב תוסף לכל שאר המשחק!';
    }
    if(pick === 'money'){
      const amt = 20 + Math.floor(Math.random()*31); // 20-50
      awardMoney(amt);
      return '💰 קיבלת ' + amt + ' כסף!';
    }
    if(pick === 'character'){
      const ch = eligibleChars[Math.floor(Math.random()*eligibleChars.length)];
      unlockedByLootbox[ch.key] = true;
      return '✨ מדהים! פתחת דמות נדירה ביותר: ' + ch.name + '!';
    }
    return '💨 התיבה הייתה ריקה הפעם...';
  }

  function onBossDefeated(){
    state = 'WON_BOSS';
    awardTrophies(10);

    let unlockMsg = '';
    if(bossIndex === 9 && !unlockedByBossDefeat.megaTantanush){
      unlockedByBossDefeat.megaTantanush = true;
      unlockMsg = '<p class="sub">🌟 פתחת דמות חדשה: ' + CHARACTERS.megaTantanush.name + '!</p>';
    }
    if(bossIndex === 19 && !unlockedByBossDefeat.megaMiliak){
      unlockedByBossDefeat.megaMiliak = true;
      unlockMsg += '<p class="sub">🌟 פתחת דמות חדשה: ' + CHARACTERS.megaMiliak.name + '!</p>';
    }

    let dotsHtml = '<div class="boss-track">';
    for(let i=0;i<TOTAL_BOSSES;i++){
      const cls = i <= bossIndex ? 'boss-dot done' : 'boss-dot';
      dotsHtml += '<div class="'+cls+'"></div>';
    }
    dotsHtml += '</div>';

    const isLastBoss = bossIndex >= TOTAL_BOSSES - 1;
    const titleHtml = isLastBoss
      ? '<h1>ניצחת את כל הבוסים!</h1><p>' + escapeHtml(playerName) + ', כבשת את כל 10 הבוסים.</p>'
      : '<h1>' + boss.theme.name + ' הובס!</h1>';
    const trophyLineHtml = isLastBoss
      ? '<p class="sub">סה"כ גביעים: ' + trophies + '</p>'
      : '<p class="sub">+10 גביעים &nbsp;|&nbsp; סה"כ: ' + trophies + '</p>';

    showOverlay(
      titleHtml + trophyLineHtml + unlockMsg + dotsHtml +
      '<div id="box-result" style="font-size:9px; min-height:22px; margin-top:8px;"></div>',
      []
    );

    // every 3rd boss defeated gives an Amazing Box instead of a regular loot box - never both
    const defeatCount = bossIndex + 1;
    const isAmazingTurn = (defeatCount % 3 === 0);

    let boxOpened = false;
    const boxBtn = isAmazingTurn
      ? makeBtn('פתח תיבה מדהימה ✨', 'gold', ()=>{
          if(boxOpened) return;
          boxOpened = true;
          boxBtn.disabled = true;
          boxBtn.style.opacity = '0.5';
          const resultText = rollAmazingBox();
          document.getElementById('box-result').innerHTML = '<span class="sub">' + resultText + '</span>';
          continueBtn.style.display = 'inline-block';
        })
      : makeBtn('פתח תיבת שלל 🎁', 'gold', ()=>{
          if(boxOpened) return;
          boxOpened = true;
          boxBtn.disabled = true;
          boxBtn.style.opacity = '0.5';
          const resultText = rollLootBox();
          document.getElementById('box-result').innerHTML = '<span class="sub">' + resultText + '</span>';
          continueBtn.style.display = 'inline-block';
        });

    const continueBtn = makeBtn(isLastBoss ? 'שחק שוב מההתחלה' : 'לבוס הבא', '', ()=>{
      if(isLastBoss){
        showStartScreen();
      } else {
        bossIndex++;
        initPlayer();
        initBoss(bossIndex);
        updateHearts();
        overlay.classList.add('hidden');
        state = 'PLAYING';
      }
    });
    continueBtn.style.display = 'none';

    panelContent.appendChild(boxBtn);
    panelContent.appendChild(continueBtn);

    if(isLastBoss) state = 'GAME_COMPLETE';
  }


  function onPlayerDead(){
    state = 'DEAD';
    trophies = Math.max(0, trophies - 1);
    trophyCountEl.textContent = trophies;
    updateHomeTrophyDisplay();
    showOverlay(
      '<h1>נפלת בקרב...</h1>'+
      '<p>' + boss.theme.name + ' ניצח את הסיבוב הזה.</p>'+
      '<p class="sub">איבדת גביע אחד. גביעים שנצברו: ' + trophies + '</p>',
      [ makeBtn('נסה שוב', 'gold', ()=>{
          initPlayer();
          initBoss(bossIndex);
          updateHearts();
          overlay.classList.add('hidden');
          state = 'PLAYING';
        }) ]
    );
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- Update ----------
  function update(dt){
    if(state !== 'PLAYING') return;

    // player movement
    let dx=0, dy=0;
    if(keys['arrowup']||keys['w']){ dy -= 1; player.facing='up'; }
    if(keys['arrowdown']||keys['s']){ dy += 1; player.facing='down'; }
    if(keys['arrowleft']||keys['a']){ dx -= 1; player.facing='left'; }
    if(keys['arrowright']||keys['d']){ dx += 1; player.facing='right'; }
    player.moving = (dx!==0||dy!==0);
    if(dx!==0 && dy!==0){ dx*=0.7071; dy*=0.7071; }
    player.x = clamp(player.x + dx*PLAYER_SPEED, 40, W-40);
    player.y = clamp(player.y + dy*PLAYER_SPEED, 90, H-40);

    if(player.attackCooldownTimer>0) player.attackCooldownTimer -= dt;
    if(player.attackTimer>0) player.attackTimer -= dt;
    if(player.invulnTimer>0) player.invulnTimer -= dt;

    // attack hit-check (once per swing, near the midpoint of the swing window)
    if(player.attackTimer > 0 && !player._hitApplied && player.attackTimer < ATTACK_DURATION*0.7){
      const ax = player.x + (player.facing==='left'?-ATTACK_RANGE:player.facing==='right'?ATTACK_RANGE:0);
      const ay = player.y + (player.facing==='up'?-ATTACK_RANGE:player.facing==='down'?ATTACK_RANGE:0);
      const d = dist(ax,ay, boss.x, boss.y);
      if(d < ATTACK_RANGE + Math.max(boss.w,boss.h)/2){
        boss.hp -= (player.skin.attackDamage || 1);
        boss.hitFlash = 150;
        updateBossBar();
        spawnParticles(boss.x, boss.y, boss.theme.accent);
        if(boss.hp <= 0){
          onBossDefeated();
        }
      }
      player._hitApplied = true;
    }
    if(player.attackTimer <= 0) player._hitApplied = false;

    // boss AI
    if(boss.hitFlash>0) boss.hitFlash -= dt;

    if(boss.pulseMode){
      // creeper: always creeps toward the player, no projectiles, no charge -
      // just a periodic pulse that only hurts if the player is close when it fires.
      const bd = dist(boss.x,boss.y, player.x, player.y);
      const dirx = (player.x-boss.x)/(bd||1), diry=(player.y-boss.y)/(bd||1);
      boss.x += dirx*boss.speed;
      boss.y += diry*boss.speed;
      boss.y = clamp(boss.y, 90, H*0.55);
      boss.x = clamp(boss.x, 60, W-60);

      boss.pulseTimer -= dt;
      if(boss.pulseTimer <= 0){
        boss.pulseTimer = boss.pulseInterval;
        boss.hitFlash = 250;
        spawnParticles(boss.x, boss.y, boss.theme.accent);
        const pd = dist(boss.x,boss.y, player.x, player.y);
        if(pd < boss.pulseRadius && player.invulnTimer<=0){
          damagePlayer(boss.pulseDamage);
        }
      }
    } else if(!boss.charging){
      const bd = dist(boss.x,boss.y, player.x, player.y);
      const dirx = (player.x-boss.x)/(bd||1), diry=(player.y-boss.y)/(bd||1);
      boss.x += dirx*boss.speed;
      boss.y += diry*boss.speed;
      boss.y = clamp(boss.y, 90, H*0.55);
      boss.x = clamp(boss.x, 60, W-60);

      boss.shootTimer -= dt;
      if(boss.shootTimer <= 0){
        boss.shootTimer = boss.shootInterval;
        const bd2 = dist(boss.x,boss.y, player.x, player.y)||1;
        projectiles.push({
          x:boss.x, y:boss.y,
          vx:(player.x-boss.x)/bd2*boss.projSpeed,
          vy:(player.y-boss.y)/bd2*boss.projSpeed,
          r:8
        });
      }

      boss.chargeTimer -= dt;
      if(boss.chargeTimer <= 0){
        boss.charging = true;
        boss.chargeWindup = 500;
        const bd3 = dist(boss.x,boss.y, player.x, player.y)||1;
        boss.chargeDir = {x:(player.x-boss.x)/bd3, y:(player.y-boss.y)/bd3};
      }
    } else {
      if(boss.chargeWindup > 0){
        boss.chargeWindup -= dt;
      } else {
        boss.x += boss.chargeDir.x * (boss.speed*6);
        boss.y += boss.chargeDir.y * (boss.speed*6);
        boss.x = clamp(boss.x, 60, W-60);
        boss.y = clamp(boss.y, 90, H-60);
        boss._chargeTravel = (boss._chargeTravel||0) + boss.speed*6;
        if(boss._chargeTravel > 220){
          boss.charging = false;
          boss._chargeTravel = 0;
          boss.chargeTimer = boss.chargeInterval;
        }
      }
    }

    // projectiles
    for(let i=projectiles.length-1;i>=0;i--){
      const p = projectiles[i];
      p.x += p.vx; p.y += p.vy;
      if(p.x<0||p.x>W||p.y<0||p.y>H){ projectiles.splice(i,1); continue; }
      if(dist(p.x,p.y,player.x,player.y) < p.r + 14 && player.invulnTimer<=0){
        const rangedDmg = (boss.rangedDamage != null) ? boss.rangedDamage : (boss.hitDamage || 1);
        damagePlayer(rangedDmg);
        projectiles.splice(i,1);
      }
    }

    // boss body touch damage (pulse bosses have no touch damage - only their pulse hurts)
    if(!boss.pulseMode && player.invulnTimer<=0){
      const touchDist = (boss.w+player.w)/2 - 6;
      if(dist(boss.x,boss.y,player.x,player.y) < touchDist){
        const base = (boss.closeDamage != null) ? boss.closeDamage : (boss.hitDamage || 1);
        const mult = boss.chargeMultiplier || 2;
        damagePlayer(boss.charging ? base*mult : base);
      }
    }

    // particles
    for(let i=particles.length-1;i>=0;i--){
      const pt = particles[i];
      pt.x += pt.vx; pt.y += pt.vy; pt.life -= dt;
      if(pt.life<=0) particles.splice(i,1);
    }
  }

  function damagePlayer(amount){
    player.hp -= amount;
    player.invulnTimer = INVULN_TIME;
    updateHearts();
    if(player.hp <= 0){
      player.hp = 0;
      updateHearts();
      onPlayerDead();
    }
  }

  function spawnParticles(x,y,color){
    for(let i=0;i<8;i++){
      const ang = Math.random()*Math.PI*2;
      particles.push({x,y,vx:Math.cos(ang)*2.5,vy:Math.sin(ang)*2.5,life:400,color});
    }
  }

  function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
  function dist(x1,y1,x2,y2){ return Math.hypot(x2-x1,y2-y1); }

  // ---------- Draw ----------
  function draw(){
    ctx.clearRect(0,0,W,H);

    // background: grass field with dirt border, blocky
    ctx.fillStyle = '#6fb8e0';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#5d9c3f';
    ctx.fillRect(0,80,W,H-80);
    // grid texture
    ctx.strokeStyle = 'rgba(0,0,0,0.06)';
    ctx.lineWidth = 1;
    for(let gx=0; gx<W; gx+=32){
      ctx.beginPath(); ctx.moveTo(gx,80); ctx.lineTo(gx,H); ctx.stroke();
    }
    for(let gy=80; gy<H; gy+=32){
      ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke();
    }
    // dirt border
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(0,H-24,W,24);
    ctx.fillRect(0,80,W,10);

    if(state==='PLAYING' || state==='WON_BOSS' || state==='DEAD'){
      drawParticles();
      drawBoss();
      drawProjectiles();
      drawPlayer();
    }
  }

  function drawParticles(){
    particles.forEach(p=>{
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, p.life/400);
      ctx.fillRect(p.x-3,p.y-3,6,6);
      ctx.globalAlpha = 1;
    });
  }

  function drawPlayer(){
    const {x,y,w,h,facing} = player;
    const skin = player.displaySkin || player.skin || CHARACTERS[selectedCharKey];
    const blink = player.invulnTimer>0 && Math.floor(player.invulnTimer/100)%2===0;
    if(blink) ctx.globalAlpha = 0.4;

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(x, y+h/2+4, w/2, 6, 0,0,Math.PI*2);
    ctx.fill();

    // legs
    ctx.fillStyle = skin.pants;
    ctx.fillRect(x-w/2+2, y+h/2-10, w-4, 10);
    // shoe cuffs
    ctx.fillStyle = skin.shoes;
    ctx.fillRect(x-w/2+2, y+h/2, w-4, 4);
    // torso
    ctx.fillStyle = skin.shirt;
    ctx.fillRect(x-w/2, y-4, w, h/2);
    // chest stripe detail
    ctx.fillStyle = skin.shirtDetail;
    ctx.fillRect(x-4, y-2, 8, h/2-8);
    // waist band
    ctx.fillStyle = skin.waist;
    ctx.fillRect(x-w/2+3, y+h/2-13, w-6, 4);
    // arms with cuffs
    ctx.fillStyle = skin.shirt;
    ctx.fillRect(x-w/2-5, y-2, 6, 12);
    ctx.fillRect(x+w/2-1, y-2, 6, 12);
    ctx.fillStyle = skin.cuffs;
    ctx.fillRect(x-w/2-5, y+8, 6, 6);
    ctx.fillRect(x+w/2-1, y+8, 6, 6);
    // head
    ctx.fillStyle = skin.skin;
    ctx.fillRect(x-w/2+3, y-h/2, w-6, h/2-2);
    // hair
    ctx.fillStyle = skin.hair;
    ctx.fillRect(x-w/2+2, y-h/2-2, w-4, 8);

    // facing indicator (eyes)
    ctx.fillStyle = skin.eyes;
    if(facing==='down') { ctx.fillRect(x-5,y-h/2+12,3,3); ctx.fillRect(x+3,y-h/2+12,3,3); }
    else if(facing==='up'){ /* back of head, no eyes */ }
    else if(facing==='left'){ ctx.fillRect(x-w/2+5,y-h/2+12,3,3); }
    else if(facing==='right'){ ctx.fillRect(x+w/2-8,y-h/2+12,3,3); }

    // sword swing
    if(player.attackTimer>0){
      ctx.fillStyle = '#d9d9d9';
      const len=34, thick=6;
      ctx.save();
      ctx.translate(x,y);
      let angle=0;
      if(facing==='up') angle=-Math.PI/2;
      else if(facing==='down') angle=Math.PI/2;
      else if(facing==='left') angle=Math.PI;
      else angle=0;
      ctx.rotate(angle);
      ctx.fillRect(w/2, -thick/2, len, thick);
      ctx.fillStyle='#b8860b';
      ctx.fillRect(w/2-4,-thick/2-2,6,thick+4);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawBoss(){
    const {x,y,w,h,theme,hitFlash,charging,chargeWindup} = boss;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(x, y+h/2+6, w/2.2, 10, 0,0,Math.PI*2);
    ctx.fill();

    const flashOn = hitFlash>0 && Math.floor(hitFlash/60)%2===0;
    const windupFlash = charging && chargeWindup>0 && Math.floor(chargeWindup/80)%2===0;

    ctx.fillStyle = (flashOn||windupFlash) ? '#ffffff' : theme.body;
    ctx.fillRect(x-w/2, y-h/2, w, h);

    ctx.fillStyle = theme.accent;
    ctx.fillRect(x-w/2+6, y-h/2+8, w-12, 10);
    ctx.fillRect(x-w/2+6, y+h/2-18, w-12, 10);

    // eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(x-w/4-4, y-6, 10, 10);
    ctx.fillRect(x+w/4-6, y-6, 10, 10);
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(x-w/4-1, y-3, 4, 4);
    ctx.fillRect(x+w/4-3, y-3, 4, 4);
  }

  function drawProjectiles(){
    projectiles.forEach(p=>{
      ctx.fillStyle = boss.theme.accent;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      ctx.stroke();
    });
  }

  // ---------- Loop ----------
  function loop(t){
    const dt = Math.min(t - lastTime, 50);
    lastTime = t;
    update(dt);
    draw();
    if(state==='PLAYING'){
      requestAnimationFrame(loop);
    } else if(state==='WON_BOSS' || state==='DEAD'){
      // still render frozen frame, wait for button
      requestAnimationFrame(loop);
      // stop updating further, just idle render
    }
  }

  // ---------- Gift voucher (one-time use, grants a free loot box) ----------
  document.getElementById('voucher-open-btn').addEventListener('click', ()=>{
    const code = window.prompt('הכנס קוד שובר:');
    if(code === null) return;
    const trimmed = code.trim();

    const skinKey = SKIN_VOUCHER_CODES[trimmed];
    if(skinKey){
      if(ownedSkins[skinKey]){
        alert('כבר מימשת את השובר הזה.');
        return;
      }
      ownedSkins[skinKey] = true;
      const sk = SKINS[skinKey];
      equippedSkin[sk.forChar] = sk.key;
      alert('🎁 השובר מומש! קיבלת את הסקין: ' + sk.name + '!');
      if(document.getElementById('char-row')) renderCharacterCards();
      if(document.getElementById('skins-row')) renderSkinCards();
      if(player && selectedCharKey === sk.forChar) player.displaySkin = getActiveSkin(selectedCharKey);
      return;
    }

    if(trimmed !== GIFT_VOUCHER_CODE){
      alert('קוד לא תקין.');
      return;
    }
    if(giftVoucherRedeemed){
      alert('כבר מימשת את השובר הזה.');
      return;
    }
    giftVoucherRedeemed = true;
    const resultText = rollLootBox();
    alert('🎁 השובר מומש! קיבלת תיבת שלל חינם:\n\n' + resultText);
    if(document.getElementById('char-row')) renderCharacterCards();
    updateHomeTrophyDisplay();
  });

  // initial idle background render behind start screen
  draw();
  showStartScreen();
})();
</script>
</body>
</html>
